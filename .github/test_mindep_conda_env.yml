name: test
channels:
  - conda-forge
  - defaults
dependencies:
  # obspy
  # No optional feature deps installed here. Keep the test tooling in sync with
  # .github/uv_mindep_requirements.txt (the uv counterpart).
  - decorator
  - lxml
  - matplotlib
  - numpy
  - scipy
  - requests
  # see pypa/setuptools#4480
  - setuptools !=71.0.1
  # see #3258
  - sqlalchemy
  # tests
  - pytest
  - pytest-cov
  - pytest-json-report >= 1.4
