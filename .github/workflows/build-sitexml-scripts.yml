name: Build SiteXML scripts

on:
  workflow_dispatch:
  push:
    tags:
      - "sitexml-scripts-*"

# Build one bundle per operating system.
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: sitexml-scripts-macos-arm64
          - os: macos-15-intel
            artifact: sitexml-scripts-macos-x86_64
          - os: ubuntu-latest
            artifact: sitexml-scripts-linux-x86_64
          - os: windows-latest
            artifact: sitexml-scripts-windows-x86_64

    steps:
      # Get the repository code.
      - uses: actions/checkout@v4

      - name: Ignore standalone tag for ObsPy install
        if: startsWith(github.ref, 'refs/tags/sitexml-scripts-')
        shell: bash
        run: |
          git tag -d "$GITHUB_REF_NAME" || true

      # Install Python for this runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller pandas openpyxl markdown playwright

      - name: Install PDF rendering browser
        run: |
          python -m playwright install chromium

      - name: Remove old build products
        run: |
          python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist')]"

      - name: Set package metadata
        id: package_metadata
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi
          release_version="${version#sitexml-scripts-}"
          release_version="${release_version#v}"
          build_date="$(date -u +%Y-%m-%d)"
          {
            echo "SITEXML_RELEASE_VERSION=${release_version}"
            echo "SITEXML_DISPLAY_VERSION=v${release_version}"
            echo "SITEXML_BUILD_DATE=${build_date}"
          } >> "$GITHUB_ENV"
          {
            echo "release_version=${release_version}"
            echo "display_version=v${release_version}"
            echo "build_date=${build_date}"
          } >> "$GITHUB_OUTPUT"

      - name: Set bundled ObsPy release version
        shell: bash
        run: |
          echo "$SITEXML_RELEASE_VERSION" > obspy/RELEASE-VERSION

      # Build both executables into one shared onedir bundle.
      - name: Build SiteXML scripts
        shell: bash
        run: |
          pyinstaller --clean --noconfirm sitexml-scripts.spec

      - name: Add documentation to package
        run: |
          python obspy/io/sitexml/docs/build_standalone_docs.py --output-dir dist/sitexml-scripts/docs --release-version "$SITEXML_RELEASE_VERSION" --build-date "$SITEXML_BUILD_DATE"
          python -c "import pathlib, shutil; root = pathlib.Path('dist/sitexml-scripts'); shutil.copytree('obspy/io/sitexml/tests/data', root / 'examples', dirs_exist_ok=True, ignore=shutil.ignore_patterns('.DS_Store'))"

      - name: Add package version file
        shell: bash
        run: |
          {
            echo "SiteXML standalone tools"
            echo "Release version: $SITEXML_RELEASE_VERSION"
            echo "Build date: $SITEXML_BUILD_DATE"
          } > dist/sitexml-scripts/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_${{ steps.package_metadata.outputs.display_version }}
          path: dist/
