name: Build SiteXML scripts

on:
  workflow_dispatch:
  push:
    tags:
      - "sitexml-scripts-*"

# Build one bundle per operating system.
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: sitexml-scripts-macos-arm64
          - os: macos-15-intel
            artifact: sitexml-scripts-macos-x86_64
          - os: ubuntu-latest
            artifact: sitexml-scripts-linux-x86_64
          - os: windows-latest
            artifact: sitexml-scripts-windows-x86_64

    steps:
      # Get the repository code.
      - uses: actions/checkout@v6

      # Install Python for this runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller pandas openpyxl markdown playwright

      - name: Install PDF rendering browser
        run: |
          python -m playwright install chromium

      - name: Remove old build products
        run: |
          python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist')]"

      # Build both executables into one shared onedir bundle.
      - name: Build SiteXML scripts
        shell: bash
        run: |
          pyinstaller --clean --noconfirm sitexml-scripts.spec

      - name: Add documentation to artifact
        run: |
          python obspy/io/sitexml/docs/build_standalone_docs.py --output-dir dist/sitexml-scripts
          python -c "import pathlib, shutil; root = pathlib.Path('dist/sitexml-scripts'); shutil.copytree('obspy/io/sitexml/tests/data', root / 'examples', dirs_exist_ok=True, ignore=shutil.ignore_patterns('.DS_Store'))"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
