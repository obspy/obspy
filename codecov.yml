# config for codecov, see https://codecov.io/gh/obspy/obspy/settings/yaml

coverage:
  status:

    # set commit status if relative change of whole project coverage
    # exceeds threshold
    project:
      default:
        target: auto
        threshold: 0
        if_no_uploads: error
        if_not_found: error
        if_ci_failed: error

    # set commit status, if coverage of diff is below target threshold
    patch:
      default:
        target: 90
        base: auto
        if_no_uploads: error
        if_not_found: error
        if_ci_failed: error

    # not exactly sure in what cases this commit status is triggered..
    changes:
      default:
        enabled: no

# no comments in PRs
comment: false

flags:
  unittests:
    carryforward: true
  unittests_network:
    carryforward: true

# ignore some files that codecov thinks is code
ignore:
  - "obspy/io/ah/tests/data/ah1.*"
  - "obspy/io/ah/tests/data/ah2.*"
